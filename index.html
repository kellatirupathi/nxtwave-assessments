<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Online Assessment Portal</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #f1f3f4, #e8eaed);
    color: #202124;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
  }
  .card {
    background: #fff;
    padding: 36px 40px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    max-width: 440px;
  }
  h1 {
    color: #1a73e8;
    margin: 0 0 12px;
    font-size: 24px;
  }
  p {
    color: #5f6368;
    line-height: 1.55;
    font-size: 14px;
    margin: 8px 0;
  }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #80868b;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Online Assessment Portal</h1>
    <p>If you have been invited to an assessment, please use the <b>exact link</b> shared with you by your invigilator or recruiter.</p>
    <p>This portal does not list active assessments publicly.</p>
    <p class="footer">For any access issues, contact the person who sent you the invite.</p>
  </div>
</div>
</body>
</html>
